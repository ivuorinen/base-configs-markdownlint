---
name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  Linter:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Push-only workflow: there is no issue or pull request to comment on, so
    # no issues/pull-requests write scope.
    permissions:
      statuses: write # to update commit statuses
      contents: read # to check out the repository
      packages: read # to read packages

    steps:
      - name: Run PR Lint
        # https://github.com/ivuorinen/actions
        uses: ivuorinen/actions/pr-lint@08beec49e790e0093f5df8063f3a484ac5a75e34 # v2026.08.12

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - Linter
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # No auth token: npm authenticates to the registry via OIDC Trusted
          # Publishing (requires a trusted publisher configured on npmjs.com).
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          scope: "@ivuorinen"

      - name: Enable corepack
        shell: sh
        # .nvmrc pins Node 26, which no longer bundles corepack. Install a pinned
        # copy with install scripts disabled — never a floating one in the job
        # that holds the release credentials.
        run: npm install -g --ignore-scripts corepack@0.35.0 && corepack enable

      - name: Cache Node Modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('.nvmrc', '**/yarn.lock') }}

      # Unconditional and immutable: a package.json-only change keeps the cache
      # key, and skipping the install on a hit would release against a stale
      # tree (semantic-release reads its rules from node_modules).
      - name: Install Dependencies
        shell: bash
        run: yarn install --immutable --mode=skip-build

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          # No NPM_TOKEN: @semantic-release/npm publishes via OIDC Trusted
          # Publishing using the id-token: write permission above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
