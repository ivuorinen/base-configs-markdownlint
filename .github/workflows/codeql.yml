---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "22 8 * * 0"
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read # to read Actions run and workflow metadata
      contents: read # to check out the repository
      packages: read # to read packages
      security-events: write # to upload SARIF results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "javascript"]
    steps:
      - name: CodeQL Analysis
        uses: ivuorinen/actions/codeql-analysis@08beec49e790e0093f5df8063f3a484ac5a75e34 # v2026.08.12
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
